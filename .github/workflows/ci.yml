name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      # SHA固定（セキュリティ監査対応。可変タグ@v4だとメンテナのアカウント侵害等で
      # 中身が差し替わるリスクがある。コメントで現在のタグを併記する）
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      # src（tsc -b）に加えて api/ も型チェックする。api/ は長らく
      # どの tsconfig の include にも入っておらず、型が一度も見られていなかった
      - run: npm run typecheck
      # scripts/test-*.mjs の契約テスト。OpenAI は叩かない（fetch を差し替える）ので
      # APIキー不要・無課金で回る
      - run: npm test

  expo:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: expo-prototype
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      # npm installだとロックファイルと違うバージョンを解決しうる（セキュリティ監査対応）
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
